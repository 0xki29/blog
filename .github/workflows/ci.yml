name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false # repo has no committed Gemfile.lock — cache step would fail
      - name: Install dependencies
        run: bundle install

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: HTML check
        shell: bash
        run: |
          set -o pipefail
          bundle exec htmlproofer ./_site --assume-extension --allow-hash-href --disable-external --check-html 2>&1 | tee "$GITHUB_STEP_SUMMARY" || {
            echo "::error::htmlproofer failed — full output above"
            exit 1
          }
