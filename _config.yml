# ===============================
#   Site Configuration
# ===============================
title: 0xki29
description: "Security research write-ups — web exploitation, CVE root-cause analysis, malware internals. All findings responsibly disclosed."
author:
  name: "0xki29"
  url: "https://0xki29.github.io"

# URL settings
url: "https://0xki29.github.io"   
baseurl: "/blog"

# Directory settings
source: .
destination: ./_site

# Permalink & pagination
permalink: /:title
paginate: 6            # 6 cards/page keeps the grid tidy up to ~30 posts
paginate_path: /page/:num/

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      image: "https://0xki29.github.io/blog/assets/og/default.png"
  -
    scope:
      path: ""
      type: "pages"
    values:
      image: "https://0xki29.github.io/blog/assets/og/default.png"

future: true

plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

# ===============================
#   Custom Variables
# ===============================
owner: "0xki29"
year: "2025"

# --- Comments (U-10 giscus) --------------------------------------
# 1. Enable GitHub Discussions on this repo
# 2. Install https://giscus.app app, pick a category (e.g. "Announcements" or "General")
# 3. Fill the 4 values below -> comments box appears on every post
# 4. Per-post opt-out: add `comments: false` to that post's front matter
giscus:
  repo:                # "0xki29/blog"
  repo-id:             # from giscus.app
  category:            # "Announcements"
  category-id:         # from giscus.app

# --- Analytics (U-11 GoatCounter, cookieless) ---------------------
# Create a free counter at goatcounter.com, then fill `code`
# (e.g. "0xki29.goatcounter.com"). Leave empty = no analytics at all.
goatcounter:
  code:                # "0xki29.goatcounter.com"

# ===============================
# ===============================
social_links:
  github: "https://github.com/0xki29"
  linkedin: ""
  twitter: ""

# Do not publish local docs / tooling / design previews
exclude:
  - design-preview
  - Gemfile
  - Gemfile.lock
  - tools
  - upgrade.md
  - WRITING.md
